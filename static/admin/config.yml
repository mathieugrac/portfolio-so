# Sveltia CMS Configuration (drop-in Decap CMS replacement)
# Using custom OAuth endpoint on Vercel

backend:
  name: github
  repo: mathieugrac/portfolio-so
  branch: main
  base_url: https://portfolio-so.vercel.app
  auth_endpoint: /api/auth

# Where uploaded images are stored
media_folder: "static/img/uploads"
public_folder: "/img/uploads"

# Locale
locale: "fr"

# Collections
collections:
  # ==================
  # PROJECTS COLLECTION
  # ==================
  - name: "projects"
    label: "Projets"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "yaml-frontmatter"
    sortable_fields: ["title", "year"]
    view_groups:
      - label: "Année"
        field: year
    fields:
      # Basic info
      - name: "title"
        label: "Titre"
        widget: "string"
        required: true

      - name: "subtitle"
        label: "Sous-titre"
        widget: "string"
        required: false
        hint: "Ex: d'après Goliarda Sapienza"

      - name: "slug"
        label: "URL (slug)"
        widget: "string"
        required: true
        pattern:
          ["^[a-z0-9-]+$", "Uniquement lettres minuscules, chiffres et tirets"]
        hint: "Ex: art-de-la-joie (sera l'URL /projects/art-de-la-joie)"

      - name: "year"
        label: "Année"
        widget: "number"
        value_type: "int"
        min: 2000
        max: 2030
        required: true

      - name: "director"
        label: "Metteur en scène"
        widget: "string"
        required: true

      - name: "cover"
        label: "Image de couverture (carte)"
        widget: "image"
        required: true
        hint: "Image affichée sur la page d'accueil (vignette du projet)"

      - name: "pageCover"
        label: "Image de couverture (page)"
        widget: "image"
        required: false
        hint: "Image affichée en haut de la page du projet. Si vide, l'image carte sera utilisée."

      - name: "description"
        label: "Description (À propos)"
        widget: "text"
        required: false
        hint: "Texte affiché dans la section 'À propos'"

      # Distribution (credits)
      - name: "distribution"
        label: "Distribution"
        widget: "list"
        required: false
        collapsed: false
        summary: "{{fields.role}}: {{fields.name}}"
        default:
          - { role: "Mise en scène", name: "" }
          - { role: "Dramaturgie", name: "" }
          - { role: "Adaptation", name: "" }
          - { role: "Traduction", name: "" }
          - { role: "Scénographie", name: "" }
          - { role: "Lumières", name: "" }
          - { role: "Son", name: "" }
          - { role: "Création vidéo", name: "" }
          - { role: "Costumes", name: "" }
          - { role: "Maquillage", name: "" }
          - { role: "Perruque", name: "" }
          - { role: "Marionnette", name: "" }
          - { role: "Collaboration artistique", name: "" }
          - { role: "Assistant(e) mise en scène", name: "" }
          - { role: "Avec", name: "" }
          - { role: "Régie générale", name: "" }
          - { role: "Construction", name: "" }
          - { role: "Crédit photo", name: "" }
          - { role: "Remerciements", name: "" }
        fields:
          - name: "role"
            label: "Rôle"
            widget: "select"
            required: false
            options:
              - "Mise en scène"
              - "Dramaturgie"
              - "Adaptation"
              - "Traduction"
              - "Scénographie"
              - "Lumières"
              - "Son"
              - "Création vidéo"
              - "Costumes"
              - "Maquillage"
              - "Perruque"
              - "Marionnette"
              - "Collaboration artistique"
              - "Assistant(e) mise en scène"
              - "Avec"
              - "Régie générale"
              - "Construction"
              - "Crédit photo"
              - "Remerciements"
          - name: "name"
            label: "Nom(s)"
            widget: "string"
            required: false

      # Content blocks (the magic!)
      - name: "blocks"
        label: "Contenu (blocs)"
        widget: "list"
        required: false
        types:
          # Image block
          - name: "image"
            label: "📷 Image"
            widget: "object"
            summary: "Image: {{fields.alt}} ({{fields.layout}})"
            fields:
              - name: "src"
                label: "Image"
                widget: "image"
                required: true
              - name: "caption"
                label: "Légende"
                widget: "string"
                required: false
              - name: "layout"
                label: "Disposition"
                widget: "select"
                default: "center"
                options:
                  - { label: "Pleine largeur", value: "center" }
                  - { label: "À gauche", value: "left" }
                  - { label: "À droite", value: "right" }
              - name: "alt"
                label: "Texte alternatif"
                widget: "string"
                required: true
                hint: "Description de l'image pour l'accessibilité"

          # Text block
          - name: "text"
            label: "📝 Texte"
            widget: "object"
            summary: "Texte: {{fields.content | truncate(50)}}"
            fields:
              - name: "content"
                label: "Contenu"
                widget: "markdown"
                required: true

  # ==================
  # SITE SETTINGS
  # ==================
  - name: "settings"
    label: "Paramètres du site"
    files:
      - name: "site"
        label: "Informations générales"
        file: "src/content/settings/site.yml"
        fields:
          - name: "name"
            label: "Nom"
            widget: "string"
          - name: "email"
            label: "Email de contact"
            widget: "string"
          - name: "portrait"
            label: "Photo de profil"
            widget: "image"
          - name: "headline"
            label: "Titre d'introduction"
            widget: "string"
          - name: "subheadline"
            label: "Sous-titre d'introduction"
            widget: "text"

      - name: "projects_order"
        label: "Ordre des projets"
        file: "src/content/settings/projects-order.yml"
        fields:
          - name: "order"
            label: "Ordre d'affichage"
            widget: "list"
            label_singular: "Projet"
            add_to_top: true
            hint: "Glissez-déposez pour réorganiser. Le premier projet de la liste apparaît en haut de la page d'accueil. Les nouveaux projets non listés apparaîtront automatiquement en premier."
            field:
              name: "slug"
              label: "Projet (slug)"
              widget: "relation"
              collection: "projects"
              search_fields: ["title", "slug"]
              value_field: "slug"
              display_fields: ["title", " (", "year", ")"]

  # ==================
  # PARCOURS (CV)
  # ==================
  - name: "parcours"
    label: "Parcours"
    files:
      - name: "experience"
        label: "Expériences"
        file: "src/content/parcours/experience.yml"
        fields:
          - name: "items"
            label: "Expériences"
            widget: "list"
            collapsed: true
            summary: "{{fields.year}}"
            fields:
              - name: "year"
                label: "Année"
                widget: "string"
              - name: "projects"
                label: "Projets"
                widget: "list"
                fields:
                  - name: "title"
                    label: "Titre"
                    widget: "string"
                  - name: "role"
                    label: "Rôle"
                    widget: "string"
                    required: false
                  - name: "desc"
                    label: "Description"
                    widget: "string"

      - name: "formation"
        label: "Formation"
        file: "src/content/parcours/formation.yml"
        fields:
          - name: "items"
            label: "Formations"
            widget: "list"
            collapsed: true
            summary: "{{fields.year}}"
            fields:
              - name: "year"
                label: "Année"
                widget: "string"
              - name: "projects"
                label: "Diplômes/Formations"
                widget: "list"
                fields:
                  - name: "title"
                    label: "Titre"
                    widget: "string"
                  - name: "desc"
                    label: "Description"
                    widget: "string"
